  screen designer canvas on admin.fuuz.app (2026-08-17).

  Verbatim apart from the SVG path data and the resize-handle divs, which carry
  nothing the scraper reads.

  What this pins:
    · every element wrapper carries BOTH data-screen-element (type) and
      data-system-name (name)

      renderer's positioning, and conflating them reports the wrong CSS

      props as attributes (formelement, field, description, element)

-->
